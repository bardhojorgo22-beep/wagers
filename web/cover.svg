<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="18%" cy="10%" r="80%">
      <stop offset="0" stop-color="#4a2e14"/>
      <stop offset="0.55" stop-color="#1d1610"/>
      <stop offset="1" stop-color="#120e0a"/>
    </radialGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c65f"/>
      <stop offset="1" stop-color="#d98a1f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#3a2f25" stroke-width="2"/>

  <!-- mug -->
  <g transform="translate(80,150)">
    <rect x="0" y="40" width="190" height="250" rx="22" fill="url(#beer)"/>
    <rect x="18" y="70" width="18" height="190" rx="9" fill="#ffe2a0" opacity=".55"/>
    <path d="M190 95 h40 a45 45 0 0 1 45 45 v70 a45 45 0 0 1 -45 45 h-40" fill="none" stroke="#e9a23b" stroke-width="26"/>
    <circle cx="35" cy="45" r="38" fill="#fbf3e4"/>
    <circle cx="90" cy="30" r="45" fill="#fbf3e4"/>
    <circle cx="150" cy="42" r="40" fill="#fbf3e4"/>
    <rect x="0" y="40" width="190" height="34" fill="#fbf3e4"/>
    <circle cx="70" cy="170" r="7" fill="#fff4d6" opacity=".7"/>
    <circle cx="120" cy="215" r="5" fill="#fff4d6" opacity=".7"/>
    <circle cx="95" cy="130" r="4" fill="#fff4d6" opacity=".7"/>
  </g>

  <g font-family="DejaVu Sans, Inter, Segoe UI, sans-serif">
    <text x="420" y="215" font-size="74" font-weight="700" fill="#f3e9dc">Tavern Wagers</text>
    <text x="422" y="272" font-size="26" fill="#c9b79e">Bet on anything with your friends.</text>
    <text x="422" y="310" font-size="26" fill="#c9b79e">Money locked upfront. Friends judge. Auto payout.</text>

    <g font-size="24" font-weight="700">
      <rect x="422" y="365" width="150" height="50" rx="25" fill="#2a221b" stroke="#e9a23b"/>
      <text x="497" y="398" text-anchor="middle" fill="#f4bd5f">LOCK</text>
      <rect x="590" y="365" width="170" height="50" rx="25" fill="#2a221b" stroke="#6fcf7c"/>
      <text x="675" y="398" text-anchor="middle" fill="#6fcf7c">REPORT</text>
      <rect x="778" y="365" width="150" height="50" rx="25" fill="#2a221b" stroke="#7fb0ff"/>
      <text x="853" y="398" text-anchor="middle" fill="#7fb0ff">JUDGE</text>
    </g>

    <text x="422" y="470" font-size="22" fill="#a8977f">1v1 bets · poker nights · honesty bonds · 0% house cut</text>
    <text x="422" y="555" font-size="22" fill="#a8977f">Built on <tspan fill="#f3e9dc" font-weight="700">Gno.land</tspan> · Gnome Tavern Hackathon</text>
  </g>
</svg>
